# Builds the website from the committed results and publishes it. The site's data is generated here, from results/, so a results commit is enough:
# nothing under site/ has to be rebuilt and committed by hand. The subject repository is public; its prettier is installed at the version each ticket pins.
name: Publish website

on:
  push:
    branches: [main]
    paths: ["results/**", "site/**", "src/**", "experiments/**", "prompts/LORE_SHA", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Clone the subject repository where experiments/halengine.yaml expects its mirror
        run: |
          mkdir -p /var/tmp/loop-bench/mirrors
          git clone --quiet --mirror https://github.com/re-cinq/HALEngine.git /var/tmp/loop-bench/mirrors/HALEngine.git
      - name: Restore the diff patches built by earlier runs
        uses: actions/cache@v4
        with:
          path: site/data/diffs
          key: site-diffs-${{ github.run_id }}
          restore-keys: site-diffs-
      - name: Install the prettier each ticket pins
        run: npx tsx src/cli.ts site-deps
      - name: Build the site data from results/
        run: npx tsx src/cli.ts site
      - name: Refuse to publish a site without data
        run: test -s site/data/bench.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
