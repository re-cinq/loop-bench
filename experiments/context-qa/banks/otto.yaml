# Questions about re-cinq/Otto with gold answers checked by hand against origin/main 3facba0 and GitHub on 2026-10-27.
repo: re-cinq/Otto
checked_at: "2026-10-27"
utopia_kb_id: 01a144c0-160b-7791-ab91-4f62e5288d6f
questions:
  - id: otto-dec-01
    kind: decision
    question: "Why does Otto use one server-side TMS API key instead of passing each user's own TMS credentials through?"
    gold_answer: "Otto uses one global TMS_API_KEY and enforces the customer boundary in its own code. Forwarding a user's credential is impossible because the TMS has no user-level auth, and per-user credentials are moot because the TMS issues one key per integration partner."
    evidence: [adrs/ADR-001-tms-authentication.md]
  - id: otto-dec-02
    kind: decision
    question: "Why does Otto always show delivery status as a card and never let the model phrase it in prose?"
    gold_answer: "The card-rate KPI (SC-006, at least 90% by 2026-Q4) needs card turns as its denominator. The compliance promise is TMS status shown verbatim, so a paraphrased ETA is the one hallucination the pilot cannot afford. Free text was proposed on PR #261 and rejected on 2026-09-25."
    evidence: [adrs/ADR-002-deterministic-delivery-status-rendering.md]
  - id: otto-dec-03
    kind: decision
    question: "Why doesn't Otto run on Cloud Run in europe-north1 as first planned?"
    gold_answer: "On 2026-10-16 europe-north1 served only Gemini 2.5, which retired on 2026-10-20, and newer Gemini models answer only on the eu multi-region. Otto runs on GKE Autopilot (n8n-cluster) in europe-west1, and #27, #162 and #168 were closed as superseded."
    evidence: [adrs/ADR-003-hosting-and-data-residency.md]
  - id: otto-dec-04
    kind: decision
    question: "Why doesn't Otto use Vertex AI's global endpoint, which serves every Gemini model?"
    gold_answer: "It would give up the EU data residency the model allowlist enforces. The model is pinned to the eu multi-region (region 'eu' in apps/api/src/configuration/models.ts, vertexLocation eu in the deploy values)."
    evidence: [adrs/ADR-003-hosting-and-data-residency.md]
  - id: otto-dec-05
    kind: decision
    question: "Why is Otto's escalation-trigger exhaustiveness check a Record rather than a switch with no default?"
    gold_answer: "A Record over EscalationTrigger fails typecheck on a missing member just as a switch would, and a switch over every member exceeds the lint complexity limit."
    evidence: [specs/support-agent-escalation/spec.md]
  - id: otto-req-01
    kind: requirement
    question: "How must Otto pick a persona for an incoming message?"
    gold_answer: "selectPersona(registry, message) is pure and uses deterministic keyword matching, not a classifier call. A case-insensitive substring of a persona's match entries selects it, the first declared persona wins a tie, and olt-support is the default when nothing matches."
    evidence: [specs/support-agent-persona/spec.md]
  - id: otto-req-02
    kind: requirement
    question: "What may Otto's Danish \"tool budget ran out\" message not contain?"
    gold_answer: "TOOL_BUDGET_MESSAGE_DA contains no < and no digit, so no phone number, email or opening hours. It also contains none of the words ring, minutter or timer, and no persona name."
    evidence: [specs/support-agent-escalation/spec.md]
  - id: otto-req-03
    kind: requirement
    question: "What inputs may Otto's escalate_to_human tool take?"
    gold_answer: "Exactly one, the required enum reason_category, with the values no_tool_for_question, customer_asked_for_human or out_of_scope_change_request."
    evidence: [specs/support-agent-escalation/spec.md]
  - id: otto-req-04
    kind: requirement
    question: "How must Otto's conversation retention period be configured?"
    gold_answer: "CONVERSATION_RETENTION_DAYS has no default. Anything but a whole number from 1 to 999999 stops the api before the port opens, naming the variable and the value, with no clamping. The Helm chart fails to render without api.conversationRetentionDays."
    evidence: [specs/support-agent-conversation-data/spec.md, apps/api/src/configuration/config.ts]
  - id: otto-req-05
    kind: requirement
    question: "Can one of Otto's tools take a customer number in its input schema?"
    gold_answer: "No. No tool may declare a customer id, company id or account number at any depth, in English or Danish spellings. registerTools refuses such a definition, and a test walks every registered definition."
    evidence: [specs/support-agent-tms-access/spec.md, adrs/ADR-001-tms-authentication.md]
  - id: otto-code-01
    kind: code-location
    question: "Where does Otto's api refuse to start when a registered tool has no declared authority?"
    gold_answer: "assertAllToolsDeclared in apps/api/src/oversight/assertAllToolsDeclared.ts, called from apps/api/src/server.ts. It checks the TOOL_AUTHORITY table in apps/api/src/oversight/toolAuthority.ts."
    evidence: [apps/api/src/oversight/assertAllToolsDeclared.ts, apps/api/src/server.ts]
  - id: otto-code-02
    kind: code-location
    question: "Where does Otto map TMS error kinds to escalation triggers, and which kinds escalate?"
    gold_answer: "ESCALATION_BY_KIND in apps/api/src/tools/defineTmsTool.ts, keyed by TmsFailureKind (the TMS client's error kinds plus Otto's own customer_scope_conflict). Three kinds escalate: unavailable (tms_unavailable), timeout (tms_timeout) and customer_scope_conflict (customer_scope_conflict); every other kind maps to null. Saying customer_scope_conflict is not one of the TMS client's own error kinds is right."
    evidence: [apps/api/src/tools/defineTmsTool.ts]
  - id: otto-code-03
    kind: code-location
    question: "Which Otto function catches a tool executor that throws?"
    gold_answer: "createCrashGuard in apps/api/src/tools/toolCrashGuard.ts. The spec calls it withCrashGuard, and either name with that file is right."
    evidence: [apps/api/src/tools/toolCrashGuard.ts]
  - id: otto-code-04
    kind: code-location
    question: "Where is the JWT claim that carries the customer number defined in Otto?"
    gold_answer: "CUSTOMER_NUMBER_CLAIM = 'customer_number' in apps/api/src/oauth/customerIdentity.ts."
    evidence: [apps/api/src/oauth/customerIdentity.ts]
  - id: otto-hist-01
    kind: history
    question: "When did Otto's human-oversight gate stop wrapping each tool executor?"
    gold_answer: "On 2026-09-29 in commit 70d7f24. The gate moved to HAL Engine 0.3.0's beforeToolCall hook, and withHumanOversight and oversightGate.ts were deleted."
    evidence: [70d7f24]
  - id: otto-hist-02
    kind: history
    question: "When did Otto's off TMS mode go away?"
    gold_answer: "On 2026-10-16 in commit e773dd8. TMS_MODE became stand-in or live, and get_booking_status registers in every deployment."
    evidence: [e773dd8]
  - id: otto-hist-03
    kind: history
    question: "When did Otto's conversations start surviving an api restart?"
    gold_answer: "On 2026-09-30 in commit 3f731c4, which composed the engine with HAL Engine 0.4.0's MongoSessionStore instead of the in-memory default store."
    evidence: [3f731c4]
  - id: otto-hist-04
    kind: history
    question: "When was Otto's own WebSocket frame recorder dropped, and what replaced it?"
    gold_answer: "On 2026-10-21 in commit 8834b9b (PR #431). HAL Engine 0.10.0's recordedFrames export replaced it."
    evidence: [8834b9b, "#431"]
  - id: otto-trk-01
    kind: tracker
    question: "Which Otto pull request recorded the TMS authentication decision?"
    gold_answer: "#412, merged 2026-10-21."
    evidence: ["#412"]
  - id: otto-trk-02
    kind: tracker
    question: "Is there an open Otto bug about the tool-budget message promising a follow-up that nobody makes?"
    gold_answer: "Yes, #498 (open, labelled lore:blocked). The message \"En kollega vil følge op…\" notifies nobody while no escalation destination is configured. It is blocked on KU-14 and on a Danish speaker (KU-15)."
    evidence: ["#498"]
  - id: otto-trk-03
    kind: tracker
    question: "Which Otto pull request routed the GCP Data Access audit logs to their own bucket, and in which region is the bucket?"
    gold_answer: "#504, merged 2026-10-25. The bucket is in europe-north1."
    evidence: ["#504", cce7e9b]
  - id: otto-trk-04
    kind: tracker
    question: "Which Otto pull request made FALLBACK_MODEL_ID actually reach HAL Engine's failover?"
    gold_answer: "#475, merged 2026-10-23, which closes issue #474."
    evidence: ["#475", "#474"]
  - id: otto-learn-01
    kind: learned
    question: "Can Otto's chat client clear its busy flag on an error frame?"
    gold_answer: "No. An INVALID_MESSAGE error can arrive between two entry_delta frames of a healthy stream. stream_end is the only terminal signal, sent once per accepted message, so busy clears only on stream_end or on socket close."
    evidence: ["#191", "#148"]
  - id: otto-learn-02
    kind: learned
    question: "In Otto, is setting a fallback model and passing resilience to HAL Engine enough for model failover?"
    gold_answer: "No. resilience is only a retry policy. HAL Engine fails over only through fallbackProviders, which buildEngine never passed. A FALLBACK_MODEL_ID of mock behind a Vertex primary would echo the customer's message back, so it is refused."
    evidence: ["#474", "#482", "#475"]
  - id: otto-learn-03
    kind: learned
    question: "Is it safe from logging for Otto to send the access token as the WebSocket subprotocol?"
    gold_answer: "Not on its own. The server echoed the first offered subprotocol into the 101 response headers, where ingress or proxy logs can capture it. The client now offers the marker hal.v1 first and then the token, and the server selects the marker."
    evidence: ["#150", "#192"]
  - id: otto-temp-01
    kind: temporal
    question: "In Otto, does store.delete(sessionId) erase the stored conversation or only the cache?"
    gold_answer: "Today it erases both. HAL Engine 0.11.0's MongoSessionStore.delete calls eraseConversation, and eraseUserData erases through it. The spec conflicts with this. FR-012/FR-066 still say delete clears only the in-memory Map, and the spec intro still names a custom PersistentSessionStore and a conversations collection. Since 3f731c4 the code uses HAL's MongoSessionStore and the hal_sessions collection."
    evidence: [specs/support-agent-conversation-data/spec.md, apps/api/src/conversations/conversationStore.ts, apps/api/src/erasure/eraseUserData.ts]
  - id: otto-temp-02
    kind: temporal
    question: "How many escalation triggers does Otto have?"
    gold_answer: "Ten in code. These are the 5 original triggers plus tool_budget_exhausted, model_call_failed, blocked_consequential_call, tool_crashed and customer_scope_conflict. The documents conflict. #151 calls its trigger \"a sixth member\", #178 says \"exactly six\" and RD-01 says nine, and needs_manual_tms_check is still undecided."
    evidence: [apps/api/src/escalation/triggers.ts, specs/support-agent-escalation/spec.md]
  - id: otto-temp-03
    kind: temporal
    question: "What happens in Otto to a tool that has no row in the authority table?"
    gold_answer: "The api refuses to start and names the tool (assertAllToolsDeclared). At call time the beforeToolCall gate also denies any unknown name by default as requires_human_action. The docs conflict. docs/human-oversight.md still describes only the deny-at-call behaviour, which dates from the per-executor wrapper (d217b6d) that 70d7f24 replaced."
    evidence: [docs/human-oversight.md, specs/support-agent-human-oversight/spec.md, apps/api/src/oversight/toolAuthority.ts]
  - id: otto-none-01
    kind: unanswerable
    question: "What p95 response-latency target do Otto's get_booking_status answers have in production?"
    gold_answer: "None. No latency target exists in the repository or the tracker."
    must_abstain: true
  - id: otto-none-02
    kind: unanswerable
    question: "How many OLT support staff per shift handle Otto's escalations?"
    gold_answer: "Unknown. Even the escalation recipient is still open (KU-14, UU-09, UU-10), and no staffing figure exists."
    must_abstain: true
