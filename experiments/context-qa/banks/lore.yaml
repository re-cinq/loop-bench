# Questions about re-cinq/lore with gold answers checked by hand against origin/main 195034dad and GitHub on 2026-10-27.
repo: re-cinq/lore
checked_at: "2026-10-27"
utopia_kb_id: 01a14133-f48c-7183-a3e2-48296b6752d6
questions:
  - id: lore-dec-01
    kind: decision
    question: How does a re-cinq npm package get published, and why does the release job compare the git tag with package.json first?
    gold_answer: A GitHub Actions workflow on a v* tag runs npm publish --provenance through npm Trusted Publishing over OIDC, with no NPM_TOKEN secret (only the very first publish of a new name uses a short-lived token). The job fails before publishing when the tag and the committed package.json version disagree, because v0.5.0 through v0.7.0 once published nothing for nine weeks while npm's duplicate-version rejection read like an auth failure.
    evidence: [adrs/ADR-045-npm-package-publishing.md]
  - id: lore-dec-02
    kind: decision
    question: How does Lore's web UI receive live run updates and plan collaboration traffic?
    gold_answer: Over one WebSocket per browser tab at lore-api's /api/ws, multiplexed into channels (run, runs, plan) with a JSON envelope. It replaced one SSE connection per run.
    evidence: [adrs/ADR-048-one-websocket-for-live-channels.md]
  - id: lore-dec-03
    kind: decision
    question: Where do Lore's agent pods run, and does Lore hold a Kubernetes client to start them?
    gold_answer: They run in pods of the external floor (re-cinq/floor), which Lore reaches only through @re-cinq/floor-client (FLOOR_API_URL). Lore holds no Kubernetes client.
    evidence: [adrs/ADR-049-external-floor.md]
  - id: lore-dec-04
    kind: decision
    question: How are Lore's service metrics collected and viewed?
    gold_answer: Each service exposes Prometheus text on a metrics port (:9464) through OpenTelemetry. kube-prometheus-stack (terraform enable_monitoring) scrapes it and Grafana shows it. Traces go to Cloud Trace, from lore-api only.
    evidence: [adrs/ADR-050-prometheus-grafana-metrics.md]
  - id: lore-dec-05
    kind: decision
    question: If pushing a spec to Utopia fails during a Lore ingest, does the ingest fail?
    gold_answer: No. Utopia is a mirror. A failed push is logged and counted (lore_utopia_mirror_failures_total) and never fails the ingest.
    evidence: [adrs/ADR-052-code-to-spec-graph-mirrored-in-utopia.md]
  - id: lore-req-01
    kind: requirement
    question: What makes Lore's auto-merge loop keep waiting instead of approving a pull request?
    gold_answer: Any of these holds the wait. Red CI, a merge conflict, an open review thread, a review not yet approved on the head commit, or the pull request being younger than auto_merge.min_age_hours (24 by default).
    evidence: [specs/protected-branch-merge/spec.md, apps/stations/src/work/pr-ready-check/decide-merge-ready.ts]
  - id: lore-req-02
    kind: requirement
    question: In Lore, after a push to main, how many implementation-loop upkeep runs can start per repository, and which pull requests go first?
    gold_answer: At most 3 per event per repository. The pull request upkept longest ago goes first. That is one never upkept, then the one whose newest upkeep run started earliest, then the oldest.
    evidence: [specs/external-floor/spec.md]
  - id: lore-req-03
    kind: requirement
    question: Which Lore loops run on a repository whose settings say nothing about them?
    gold_answer: Triage, spec upkeep and spec tickets are on by omission. The implementation loop, code review (auto_review), auto-merge and digest are off by omission.
    evidence: [libs/shared/src/domain/loops/loop-enabled.ts]
  - id: lore-req-04
    kind: requirement
    question: What does Lore strip from memories and episodes before storing them?
    gold_answer: API keys, JWTs, private keys, connection strings and bearer tokens, removed by sanitizeContent()/redactSecrets().
    evidence: [libs/shared/src/lib/redact.ts, CLAUDE.md]
  - id: lore-req-05
    kind: requirement
    question: What must a Lore skill's SKILL.md contain for the pull request check to pass?
    gold_answer: A Help block fenced by <!-- lore-help:begin --> and <!-- lore-help:end --> holding a **Summary.** and a **Usage:**. The skill-help check (scripts/check-skill-help.sh) fails a skill without one.
    evidence: [specs/lore-help/spec.md]
  - id: lore-code-01
    kind: code-location
    question: In Lore, which file decides whether a pull request is ready for the auto-merge loop to approve?
    gold_answer: apps/stations/src/work/pr-ready-check/decide-merge-ready.ts, with its reads in merge-readers.ts beside it.
    evidence: [apps/stations/src/work/pr-ready-check/decide-merge-ready.ts]
  - id: lore-code-02
    kind: code-location
    question: Where is the Lore-Task footer of Lore-authored pull request bodies composed?
    gold_answer: prFooter() in libs/shared/src/domain/pr-body.ts.
    evidence: [libs/shared/src/domain/pr-body.ts]
  - id: lore-code-03
    kind: code-location
    question: Which Lore function puts a GitHub issue into a repository's implementation backlog?
    gold_answer: queueTicket in libs/shared/src/work/backlog/queue-ticket.ts. It applies to an issue with a priority:* label, which a lore or lore:implementation label also gives.
    evidence: [libs/shared/src/work/backlog/queue-ticket.ts]
  - id: lore-code-04
    kind: code-location
    question: Where is the similarity threshold that marks two Lore memory facts as contradicting defined, and what is its value?
    gold_answer: FACT_SIMILARITY_THRESHOLD = 0.92 in libs/shared/src/outbound/dgraph-fact-contradictions.ts.
    evidence: [libs/shared/src/outbound/dgraph-fact-contradictions.ts]
  - id: lore-hist-01
    kind: history
    question: When was Lore's own Floor engine (apps/floor) deleted, and what replaced it?
    gold_answer: On 2026-10-02 in commit ca031776d (#2431). The external floor (re-cinq/floor, ADR-049) replaced it.
    evidence: [ca031776d, "#2431"]
  - id: lore-hist-02
    kind: history
    question: When was Lore's nightly context reindex job retired?
    gold_answer: On 2026-09-08 in commit 961755bac (#1880).
    evidence: [961755bac, "#1880"]
  - id: lore-hist-03
    kind: history
    question: When was Lore's event-router deleted, and what now receives GitHub webhooks?
    gold_answer: It was deleted on 2026-10-03 (6682f8999, #2491). lore-api's POST /api/webhook/github receives the webhooks and writes pipeline.events.
    evidence: [6682f8999, "#2491"]
  - id: lore-hist-04
    kind: history
    question: When did Lore's context reads become able to choose between Lore's own stores and Utopia?
    gold_answer: On 2026-10-16 in commit fb53a29c0 (#2787), which added backend lore | utopia | both.
    evidence: [fb53a29c0, "#2787"]
  - id: lore-trk-01
    kind: tracker
    question: Which Lore pull request moved the implementation loop's fix-ci step to Gemini 4 Argon?
    gold_answer: "#3705, merged 2026-10-26."
    evidence: ["#3705"]
  - id: lore-trk-02
    kind: tracker
    question: Which Lore issue tracks retiring Dgraph by mirroring the code-to-spec graph into Utopia?
    gold_answer: "#2766, \"Retire Dgraph: mirror the code-to-spec graph in Utopia, slice 1\"."
    evidence: ["#2766"]
  - id: lore-trk-03
    kind: tracker
    question: Which Lore pull request added the spec tickets loop to the Loops tab?
    gold_answer: "#3392, merged 2026-10-24."
    evidence: ["#3392"]
  - id: lore-trk-04
    kind: tracker
    question: Which Lore pull request stopped the context evals from running on a schedule?
    gold_answer: "#2823, merged 2026-10-19 (\"run from a developer machine, never on a schedule\")."
    evidence: ["#2823"]
  - id: lore-learn-01
    kind: learned
    question: In Lore, why can an OpenTelemetry instrument created at module import never record anything?
    gold_answer: The OTel metrics API has no proxy meter. An instrument created before the SDK registers its meter provider stays a no-op for good, so Lore resolves its instruments lazily against the current provider.
    evidence: [libs/shared/src/outbound/otel/, CLAUDE.md]
  - id: lore-learn-02
    kind: learned
    question: Why did Lore's Gemini agent pods before 2026-09-23 run with no MCP tools?
    gold_answer: ai-agent-subsystem v0.11.2 wrote the MCP servers into a system-scope settings file, which gemini-cli refuses for a uid-1000 directory. v0.11.3 writes them to the user settings (/agent/.gemini/settings.json).
    evidence: [CLAUDE.md]
  - id: lore-learn-03
    kind: learned
    question: Why does Lore's weekly Utopia backfill sweep call lore-api over node:http rather than fetch?
    gold_answer: fetch gives up after 5 minutes without response headers, and a backfill takes longer. The sweep uses node:http with a 30-minute wait.
    evidence: [CLAUDE.md]
  - id: lore-temp-01
    kind: temporal
    question: Must Lore's code review run on a different model family from the implementer?
    gold_answer: No longer. ADR-039 made cross-family review the rule. Its 2026-10-14 amendment put code-review and code-review-recheck on gemini-4-argon, the implementation loop's own family, because it caught more, so cross-family is now only one input to the model choice.
    evidence: [adrs/ADR-039-cross-model-review.md]
  - id: lore-temp-02
    kind: temporal
    question: Does Lore's auto-merge loop fix a pull request whose CI is red?
    gold_answer: No. It did when it shipped (#3320, 2026-10-23), but #3376 the same day removed the fix agent ("auto merge fixes nothing"). A loop pull request is repaired by the implementation loop's upkeep run, and a person's pull request by the person.
    evidence: ["#3320", "#3376", specs/protected-branch-merge/spec.md]
  - id: lore-temp-03
    kind: temporal
    question: Do Lore's context evals run nightly in CI?
    gold_answer: No. They ran nightly from 2026-10-02 (#2463) until #2823 (2026-10-19) removed the schedule. They now run from a developer machine.
    evidence: ["#2463", "#2823"]
  - id: lore-none-01
    kind: unanswerable
    question: What p99 latency SLO is defined for Lore's /api/context route?
    gold_answer: None. No SLO or p99 latency target is defined anywhere for /api/context.
    must_abstain: true
  - id: lore-none-02
    kind: unanswerable
    question: Who is the PagerDuty on-call owner for lore-api?
    gold_answer: Unknown. No on-call owner is recorded in the repository, its docs or its tracker.
    must_abstain: true
