# The first dataset: five tickets the implementation loop merged on re-cinq/HALEngine, replayed from each merge's first parent.
id: halengine
subject:
  repo: re-cinq/HALEngine
  # The bench's own mirror, so nothing that touches a working checkout can break a run.
  mirror_dir: /var/tmp/loop-bench/mirrors/HALEngine.git
  install_command: npm ci --ignore-scripts
  # The pull request's CI steps (.github/workflows/ci.yml, job Verify) that a loop round can turn red.
  ci_checks:
    - { name: typecheck, command: npm run typecheck }
    - { name: eslint, command: npm run eslint }
    - { name: prettier, command: npm run prettier:check }
    - { name: test, command: npm run test:coverage, timeout_minutes: 15 }
    - { name: spec-names, command: npm run spec:names }
    - { name: spec-links, command: npm run check:spec-links }
    - { name: spec-status, command: npm run check:spec-status }
    - { name: changelog, command: bash scripts/check-changelog.sh origin/main }
tickets:
  # complexity: the merged PR's production change. small = 1 file, under 20 lines; medium = a few files, ~100 lines; large = many files across modules.
  - { number: 93, title: "Report usage across every tool round, not just the last", ticket_file: halengine/tickets/93.md, reference_pr: 96, merge_sha: 652b6dceb19854595fe70204bfe45e32d571da53, base_sha: 867ad52245c83bc5b98046cc94c5189002b81c42, complexity: small }
  - { number: 94, title: "Run onError and afterSession when beforeSession throws", ticket_file: halengine/tickets/94.md, reference_pr: 98, merge_sha: bc26def20776128c7955deafadc4dcaae6210dbd, base_sha: dd5308e594d3f3d316ec40082f3c20e174738535, complexity: small }
  - { number: 95, title: "Call onError for a rejection that is not an Error", ticket_file: halengine/tickets/95.md, reference_pr: 99, merge_sha: c61075537f7a4011653584baa249bdc1ee5fdd96, base_sha: 684b294487e297395e5b8b19260a0bc373daa816, complexity: small }
  - { number: 37, title: "Validate tool input against the registered inputSchema", ticket_file: halengine/tickets/37.md, reference_pr: 84, merge_sha: 7a6b01b51ff9ff2ec1e65d8d0b6a93da2260f520, base_sha: 8c3318edcbc9c85f25749ddabd14d825a8c73c04, complexity: medium }
  # Paused 2026-10-20: a fourth small ticket, and both Gemini seeds wrote a dod that does not match the merged fix.
  #   - { number: 89, title: "Let a Vertex deployment reach the EU multi-region endpoint", ticket_file: halengine/tickets/89.md, reference_pr: 90, merge_sha: e09b3760c6f11aa2bed3c07f92fe03ef1a0aed40, base_sha: d97c1e7457a919add024e86c95782ac6f48f0059 }
  - { number: 144, title: "Deliver a user's conversation list over the WebSocket protocol", ticket_file: halengine/tickets/144.md, reference_pr: 152, merge_sha: 4c26b5f0852635d8ce5d31ca59af7a7eecc23ea9, base_sha: 2926558eb8287942fc3ff3636da112e8eee3d2bd, complexity: large }
