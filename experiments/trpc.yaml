# A large ticket from a public repository: trpc/trpc #3768 (localLink), merged as PR #6806.
# Lore holds nothing on trpc, so only the without-Lore setting is meaningful here.
id: trpc
subject:
  repo: trpc/trpc
  mirror_dir: /var/tmp/loop-bench/mirrors/trpc.git
  install_command: pnpm install --frozen-lockfile
  deps_layout: workspace
  path_prepend: [/var/tmp/loop-bench/bin]
  env: { COREPACK_HOME: /var/tmp/loop-bench/corepack, COREPACK_ENABLE_DOWNLOAD_PROMPT: "0" }
  format_pattern: "^packages/(client|server)/src/.*\\.ts$"
  # The PR's CI (main.yml, lint.yml) scoped to the packages the ticket spans; react-query and upgrade tests fail on timing at the base, unrelated to it.
  ci_checks:
    - { name: lint, command: pnpm turbo lint --filter=@trpc/client --filter=@trpc/server }
    - { name: typecheck, command: pnpm turbo test-run:tsc --filter=@trpc/client --filter=@trpc/server }
    - { name: format, command: pnpm prettier --check packages/client packages/server }
    - { name: test, command: pnpm vitest run packages/client packages/server packages/tests/server, timeout_minutes: 15 }
tickets:
  - { number: 3768, title: "feat: add localLink / ssrLink that runs the router in the same process as the client", ticket_file: trpc/tickets/3768.md, reference_pr: 6806, merge_sha: e54c2b3ee6d9559847e8f3a9710d629c809043ad, base_sha: 836788f4fea787be31bbec1ab2e692fa38297ad0, complexity: large }
baseline:
  dod: { harness: gemini, model: gemini-3.1-pro-preview }
  tdd-round: { harness: claude, model: claude-sonnet-4-6 }
  repair-build: { harness: gemini, model: gemini-3.1-pro-preview }
